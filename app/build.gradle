plugins {
    id 'com.android.application'
}

def yawacStorePassword = System.getenv('YAWAC_STORE_PASSWORD')
def yawacKeyPassword = System.getenv('YAWAC_KEY_PASSWORD') ?: yawacStorePassword

// Local-only build input; the key itself never enters the repository.
def yawacEmbeddedKeyFile = rootProject.file('../YAWAC-signing/embedded-api-key.txt')
def yawacEmbeddedApiKey = yawacEmbeddedKeyFile.exists() ? yawacEmbeddedKeyFile.text.trim() : ''
def yawacEmbeddedKey = yawacEmbeddedApiKey.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.yawac.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.yawac.client"
        minSdk 30
        targetSdk 34
        versionCode 34
        versionName "1.33"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"

        buildConfigField "String", "EMBEDDED_API_KEY", "\"${yawacEmbeddedKey}\""

    }

    signingConfigs {
        release {
            storeFile rootProject.file('../YAWAC-signing/yawac-release.p12')
            storePassword yawacStorePassword
            keyAlias 'yawac-release'
            keyPassword yawacKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // Allow Android to map the bundled font directly instead of inflating 8 MB on startup.
    androidResources {
        noCompress += ['ttf']
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    // The platform test runner lives in optional SDK jars; production does not need them.
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/${android.compileSdkVersion}/optional/android.test.runner.jar",
            "${android.sdkDirectory}/platforms/${android.compileSdkVersion}/optional/android.test.base.jar")
}
